name: RunPod deploy v2

on:
  push:
    branches: [main]
    paths:
      - "videoclean/**"
      - "server/**"
      - "webui/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/runpod-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "start | deploy | stop (terminate)"
        required: true
        type: choice
        options:
          - deploy
          - start
          - stop
        default: deploy

concurrency:
  group: runpod-deploy
  cancel-in-progress: true

env:
  RUNPOD_POD_NAME: ${{ vars.RUNPOD_POD_NAME || 'videoclean-dev' }}
  RUNPOD_DATA_CENTER: ${{ vars.RUNPOD_DATA_CENTER || 'EU-RO-1' }}
  RUNPOD_IMAGE: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  # Optional override; normally resolved from RunPod API v2 ssh.proxy.username
  RUNPOD_SSH_PROXY_SUFFIX: ${{ vars.RUNPOD_SSH_PROXY_SUFFIX }}

jobs:
  # Gate: webui must compile before we touch the GPU pod.
  build-web:
    if: >
      github.event_name == 'push' ||
      inputs.action == 'deploy' ||
      inputs.action == 'start'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and build webui
        working-directory: webui
        run: |
          bun install --frozen-lockfile
          bun run build

  deploy:
    needs: build-web
    if: >
      always() &&
      needs.build-web.result == 'success' &&
      (github.event_name == 'push' || inputs.action == 'deploy' || inputs.action == 'start')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH + runpodctl
        env:
          RUNPOD_SSH_PRIVATE_KEY: ${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq openssh-client
          test -n "${RUNPOD_SSH_PRIVATE_KEY}" || { echo "missing secret RUNPOD_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${RUNPOD_API_KEY}" || { echo "missing secret RUNPOD_API_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${RUNPOD_SSH_PRIVATE_KEY}" > ~/.ssh/runpod_key
          chmod 600 ~/.ssh/runpod_key
          echo "RUNPOD_SSH_KEY_PATH=${HOME}/.ssh/runpod_key" >> "${GITHUB_ENV}"
          curl -fsSL -o /usr/local/bin/runpodctl \
            "https://github.com/runpod/runpodctl/releases/download/v2.14.0/runpodctl-linux-amd64"
          chmod +x /usr/local/bin/runpodctl
          # runpodctl reads RUNPOD_API_KEY from the environment (config/doctor not required).
          mkdir -p "${HOME}/.runpod"
          printf 'apiKey: "%s"\n' "${RUNPOD_API_KEY}" > "${HOME}/.runpod/config.toml"
          chmod +x scripts/runpod-api.sh scripts/runpod_ssh_exec.py \
            scripts/runpod-remote-deploy.sh scripts/runpod-env.sh \
            scripts/runpod-restart.sh scripts/runpod-start.sh scripts/runpod-bootstrap.sh

      - name: Ensure pod (start if requested)
        id: ensure
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
          WANT_START: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'start' }}
        run: |
          set -euo pipefail
          running="$(scripts/runpod-api.sh find-running || true)"
          if [[ -n "${running}" ]]; then
            echo "pod_id=$(jq -r .id <<<"${running}")" >> "${GITHUB_OUTPUT}"
            echo "offline=false" >> "${GITHUB_OUTPUT}"
            printf '%s' "${running}" > /tmp/pod.json
            exit 0
          fi

          if [[ "${WANT_START}" != "true" ]]; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "Pod offline — skip deploy (Actions → RunPod deploy → start)."
              echo "offline=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "No RUNNING pod named ${RUNPOD_POD_NAME}. Choose action=start." >&2
            exit 1
          fi

          leftover="$(scripts/runpod-api.sh find-any || true)"
          if [[ -n "${leftover}" ]]; then
            lid="$(jq -r .id <<<"${leftover}")"
            echo "terminating leftover pod ${lid}"
            scripts/runpod-api.sh terminate "${lid}" || true
            sleep 5
          fi

          created="$(scripts/runpod-api.sh create)"
          pid="$(jq -r .id <<<"${created}")"
          echo "created pod ${pid}"
          # Give cold start time to clone; proxy deploy does not need TCP.
          for i in $(seq 1 36); do
            curl -fsS -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              "https://rest.runpod.io/v1/pods/${pid}" > /tmp/pod.json || true
            status="$(jq -r .desiredStatus /tmp/pod.json 2>/dev/null || echo "")"
            echo "status=${status} (${i}/36)"
            [[ "${status}" == "RUNNING" ]] && break
            sleep 5
          done
          sleep 20
          echo "pod_id=${pid}" >> "${GITHUB_OUTPUT}"
          echo "offline=false" >> "${GITHUB_OUTPUT}"

      - name: Pull + build UI + restart on pod
        if: steps.ensure.outputs.offline != 'true'
        env:
          POD_ID: ${{ steps.ensure.outputs.pod_id }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/remote_deploy.sh <<EOF
          set -euo pipefail
          export RUNPOD_POD_ID='${POD_ID}'
          export VIDEOCLEAN_REF=main
          # Cold start may still be cloning the first time.
          for i in \$(seq 1 90); do
            if [[ -f /workspace/videoclean/.git/HEAD ]]; then
              break
            fi
            echo "waiting for git clone (\${i}/90)..."
            sleep 5
          done
          # Bootstrap remote-deploy.sh from git if this volume has an older checkout.
          cd /workspace/videoclean
          git fetch origin main
          git reset --hard origin/main
          bash /workspace/videoclean/scripts/runpod-remote-deploy.sh
          test -f /workspace/videoclean/server/static_dist/index.html
          EOF

          python3 scripts/runpod_ssh_exec.py \
            --pod-id "${POD_ID}" \
            --pod-json "$(cat /tmp/pod.json 2>/dev/null || echo '{}')" \
            --script-file /tmp/remote_deploy.sh \
            --timeout 1200

          echo "UI: https://${POD_ID}-7860.proxy.runpod.net"

  stop:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'stop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terminate pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          chmod +x scripts/runpod-api.sh
          pod_json="$(scripts/runpod-api.sh find-any || true)"
          if [[ -z "${pod_json}" ]]; then
            echo "No pod named ${RUNPOD_POD_NAME} to terminate."
            exit 0
          fi
          pid="$(jq -r .id <<<"${pod_json}")"
          scripts/runpod-api.sh terminate "${pid}"
          echo "Terminated ${pid}"
