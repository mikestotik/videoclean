name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync + test
        run: |
          uv sync --extra web --extra lama --no-dev
          uv run pytest -q

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  docker-web:
    runs-on: ubuntu-latest
    needs: [webui]
    steps:
      - uses: actions/checkout@v4
      # API image is CUDA-heavy; build locally / on GPU runners. Web image is the light CI check.
      - name: Build web image (no push)
        run: docker build -f Dockerfile.web -t videoclean-web:ci --build-arg VITE_API_BASE_URL=http://localhost:7860 .
