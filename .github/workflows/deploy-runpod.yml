name: Deploy RunPod

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: GPU type id
        default: NVIDIA RTX 2000 Ada Generation
      cloud:
        description: SECURE or COMMUNITY
        default: COMMUNITY
      pod_name:
        description: Pod name (used for idempotency)
        default: videoclean-test
      container_disk_gb:
        description: Container disk in GB
        default: "40"
      volume_gb:
        description: Pod volume in GB (ignored when a network volume id is set)
        default: "50"
      network_volume_id:
        description: Optional existing network volume id (survives pod terminate)
        default: ""
      image_tag:
        description: Image tag in GHCR
        default: runpod
      data_center_ids:
        description: Optional comma-separated datacenter ids, e.g. US-TX-3
        default: ""
  workflow_run:
    workflows: [Build image]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-runpod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy pod (manual settings)
        if: github.event_name == 'workflow_dispatch'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_NAME: ${{ inputs.pod_name }}
          RUNPOD_IMAGE: ghcr.io/${{ steps.meta.outputs.repo }}:${{ inputs.image_tag }}
          RUNPOD_GPU: ${{ inputs.gpu }}
          RUNPOD_CLOUD: ${{ inputs.cloud }}
          RUNPOD_CONTAINER_DISK_GB: ${{ inputs.container_disk_gb }}
          RUNPOD_VOLUME_GB: ${{ inputs.volume_gb }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
          RUNPOD_DATA_CENTERS: ${{ inputs.data_center_ids }}
          VIDEOCLEAN_UI_USER: ${{ vars.VIDEOCLEAN_UI_USER }}
          VIDEOCLEAN_UI_PASSWORD: ${{ secrets.VIDEOCLEAN_UI_PASSWORD }}
        run: bash scripts/runpod-deploy.sh

      - name: Deploy pod (after image build)
        # Auto-restart on every build is disruptive: enable explicitly with the
        # AUTO_DEPLOY='true' repo variable. workflow_dispatch always works.
        # Update-only: an unattended trigger must never create (and bill) a new pod.
        if: >-
          github.event_name == 'workflow_run'
          && vars.AUTO_DEPLOY == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_NAME: ${{ vars.RUNPOD_POD_NAME }}
          RUNPOD_IMAGE: ghcr.io/${{ steps.meta.outputs.repo }}:runpod
          RUNPOD_UPDATE_ONLY: "1"
          VIDEOCLEAN_UI_USER: ${{ vars.VIDEOCLEAN_UI_USER }}
          VIDEOCLEAN_UI_PASSWORD: ${{ secrets.VIDEOCLEAN_UI_PASSWORD }}
        run: bash scripts/runpod-deploy.sh

      - name: Auto-deploy disabled
        if: >-
          github.event_name == 'workflow_run'
          && vars.AUTO_DEPLOY != 'true'
        run: >-
          echo "Image built, but AUTO_DEPLOY is not 'true'; not restarting the pod.
          Run 'Deploy RunPod' workflow_dispatch to deploy."
