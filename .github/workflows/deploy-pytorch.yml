name: Deploy PyTorch pod

# Test-loop deploy: stock RunPod PyTorch template + repo clone on boot.
# No image build — pod is up in ~5 minutes. Code updates are `git pull`
# + restart inside the pod, not a rebuild.
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: GPU type id
        default: NVIDIA GeForce RTX 4090
      cloud:
        description: SECURE or COMMUNITY
        default: COMMUNITY
      pod_name:
        description: Pod name (must be unique; fails if taken)
        default: videoclean-dev3
      container_disk_gb:
        description: Container disk in GB
        default: "40"
      volume_gb:
        description: Pod volume in GB (ignored when a network volume id is set)
        default: "50"
      network_volume_id:
        description: Optional existing network volume id (survives pod terminate)
        default: ""
      data_center_ids:
        description: Optional comma-separated datacenter ids, e.g. US-TX-3
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-pytorch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Create pod (v2 API)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_NAME: ${{ inputs.pod_name }}
          GPU: ${{ inputs.gpu }}
          CLOUD: ${{ inputs.cloud }}
          CONTAINER_DISK_GB: ${{ inputs.container_disk_gb }}
          VOLUME_GB: ${{ inputs.volume_gb }}
          NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
          DATA_CENTERS: ${{ inputs.data_center_ids }}
          VIDEOCLEAN_UI_USER: ${{ vars.VIDEOCLEAN_UI_USER }}
          VIDEOCLEAN_UI_PASSWORD: ${{ secrets.VIDEOCLEAN_UI_PASSWORD }}
          IMAGE: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
        run: |
          set -euo pipefail
          : "${RUNPOD_API_KEY:?RUNPOD_API_KEY is not set}"
          : "${VIDEOCLEAN_UI_PASSWORD:?VIDEOCLEAN_UI_PASSWORD is not set}"
          [[ "$CLOUD" == "SECURE" || "$CLOUD" == "COMMUNITY" ]] || { echo "cloud must be SECURE or COMMUNITY" >&2; exit 1; }

          api() {
            curl -sS --fail-with-body --max-time 60 --retry 2 \
              -H "Authorization: Bearer $RUNPOD_API_KEY" "$@"
          }

          # Fail fast if the name is taken (this flow never updates in place).
          pods="$(api "https://api.runpod.io/v2/pods")"
          if printf '%s' "$pods" | jq -e --arg n "$POD_NAME" '.pods // . | map(select(.name == $n)) | length > 0' >/dev/null; then
            echo "pod '$POD_NAME' already exists — terminate it in the console or pick another name" >&2
            exit 1
          fi

          dc_json="[]"
          if [[ -n "$NETWORK_VOLUME_ID" ]]; then
            # v1 route is case-sensitive: /networkvolumes (all lowercase).
            vol="$(api "https://rest.runpod.io/v1/networkvolumes/$NETWORK_VOLUME_ID")"
            vol_dc="$(printf '%s' "$vol" | jq -r '.dataCenterId // empty')"
            [[ -n "$vol_dc" ]] || { echo "network volume has no dataCenterId: $vol" >&2; exit 1; }
            dc_json="$(jq -c -n --arg d "$vol_dc" '[$d]')"
            mounts="$(jq -c -n --arg id "$NETWORK_VOLUME_ID" '{network:[{volumeId:$id, path:"/workspace"}]}')"
          else
            [[ "$VOLUME_GB" =~ ^[1-9][0-9]*$ ]] || { echo "volume_gb must be a positive integer" >&2; exit 1; }
            mounts="$(jq -c -n --argjson s "$VOLUME_GB" '{persistent:{size:$s, path:"/workspace"}}')"
            if [[ -n "$DATA_CENTERS" ]]; then
              dc_json="$(jq -c -n --arg d "$DATA_CENTERS" '$d | split(",") | map(gsub("^\\s+|\\s+$";""))')"
            fi
          fi

          user="${VIDEOCLEAN_UI_USER:-admin}"
          body="$(jq -c -n \
            --arg name "$POD_NAME" \
            --arg gpu "$GPU" \
            --arg cloud "$CLOUD" \
            --argjson cd "$CONTAINER_DISK_GB" \
            --argjson dc "$dc_json" \
            --argjson mounts "$mounts" \
            --arg image "$IMAGE" \
            --arg u "$user" \
            --arg p "$VIDEOCLEAN_UI_PASSWORD" \
            --arg script "$(cat scripts/pytorch-start.sh)" \
            '{
              name:$name,
              image:$image,
              cloud:$cloud,
              gpu:{id:$gpu, count:1},
              disk:$cd,
              ports:["7860/http"],
              dataCenterIds:$dc,
              mounts:$mounts,
              env:{
                VIDEOCLEAN_AUTH:"on",
                VIDEOCLEAN_UI_USER:$u,
                VIDEOCLEAN_UI_PASSWORD:$p,
                VIDEOCLEAN_PORT:"7860",
                VIDEOCLEAN_DATA_DIR:"/root/.videoclean",
                HF_HOME:"/workspace/.cache/huggingface",
                SAM2_BUILD_CUDA:"0"
              },
              args:{entrypoint:["/bin/bash","-lc"], cmd:[$script]} | tostring
            }')"

          resp="$(api -X POST -H 'Content-Type: application/json' --data "$body" "https://api.runpod.io/v2/pods")" \
            || { echo "RunPod API error (create pod): $resp" >&2; exit 1; }
          pod_id="$(printf '%s' "$resp" | jq -r '.id // empty')"
          [[ -n "$pod_id" ]] || { echo "RunPod API error (no id in response): $resp" >&2; exit 1; }

          echo "created: id=$pod_id"
          echo
          echo "Proxy URL: https://${pod_id}-7860.proxy.runpod.net"
          echo "First boot installs app deps and sam2 on top of the image torch; watch the pod logs in the console."
