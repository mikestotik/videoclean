[project]
name = "videoclean"
version = "0.1.0"
description = "CLI video cleanup: find overlays from a prompt, remove them, write a clean MP4."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  # Use full opencv-python (not headless): simple-lama-inpainting pulls
  # opencv-python, and uninstalling that extra previously left a broken
  # opencv-python-headless metadata with no cv2/ module on disk.
  "opencv-python>=4.9,<5",
  "pillow>=12.3.0",
  "rich>=13.7,<15",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.56.2",
  "typer>=0.12,<1",
]

[project.scripts]
videoclean = "videoclean.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoclean", "server"]

[project.optional-dependencies]
gpu = [
  "scipy>=1.11,<2",
  "einops>=0.7,<1",
  "timm>=0.9,<2",
  "matplotlib>=3.8,<4",
  "imageio>=2.34,<3",
]
local-llm = [
  "llama-cpp-python>=0.3,<1",
]
lama = [
    "simple-lama-inpainting==0.1.0",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.23",
    "hf-transfer>=0.1.6",
]
# uv sync --extra X replaces previously enabled extras. Install web+lama together:
#   uv sync --extra web --extra lama
# or:
#   uv sync --extra ui
ui = [
    "videoclean[web,lama]",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8,<9",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
