[project]
name = "videoclean"
version = "0.1.0"
description = "CLI video cleanup: find overlays from a prompt, remove them, write a clean MP4."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.9,<5",
  "pillow>=12.3.0",
  "rich>=13.7,<15",
  "torch==2.2.2",
  "torchvision==0.17.2",
  "transformers==4.56.2",
  "typer>=0.12,<1",
]

[project.scripts]
videoclean = "videoclean.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videoclean"]

[project.optional-dependencies]
gpu = [
  "scipy>=1.11,<2",
  "einops>=0.7,<1",
  "timm>=0.9,<2",
]
local-llm = [
  "llama-cpp-python>=0.3,<1",
]
lama = [
    "simple-lama-inpainting>=0.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
